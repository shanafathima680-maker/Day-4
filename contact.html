<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/contact.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
  <section>
    <div class="main">
        <div class="klo">
          <div class="meg">
            <span><i class="fa-regular fa-message"></i></span>
            <span>Get in Touch</span>
          </div>
          <div class="ct">Contact Us</div>
          <div class="pg">
            <span> we're here to help to find the right Fashion </span>
          </div>
          <div class="wel">
            <div class="al">
              <span class="loc"><i class="fa-solid fa-location-dot"></i></span>
              <div class="lk">
                <span class="mk">Office Location</span> <br />
                <span class="lp">Francis Road,673003</span>
              </div>
            </div>
            <div class="kol">
              <span class="loc"><i class="fa-solid fa-phone"></i></span>
              <div class="lk">
                <span class="mk">Phone</span> <br />
                <span class="lp">+91 9744456482</span>
              </div>
            </div>
            <div class="kol">
              <span class="loc"><i class="fa-regular fa-envelope"></i></span>
              <div class="lk">
                <span class="mk">Email</span> <br />
                <span class="lp">Hello@gmail.com</span>
              </div>
            </div>
          </div>
        </div>
      <div class="alcard">
        <div class="namecl1">
          <span>Full Name</span><br />
          <input class="jn" type="text" placeholder="Enter your name" />
        </div>
        <div class="namecl2">
          <span>Phone</span><br />
          <input class="jn" type="tel" placeholder="Enter your number" />
        </div>
        <div class="namecl3">
          <span>Inquiry type</span><br />
          <input class="jn" type="text" placeholder="Buying a Dress" />
        </div>
        <div class="namecl4">
          <span>Message (optional)</span><br />
          <input type="text" />
        </div>
        <div class="submit">
          <button>Submit</button>
        </div>
        <div class="ct1">
          <button><i class="fa-solid fa-check"></i></button>
          <span>
            By submitting this form, I agree to the <b>Privacy Policy</b>
          </span>
        </div>
      </div>
    </div>
  </section>
  </body>
</html>
